<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Direct Kitchens — story-03-living-20s (P7.0 Cinematic Kinetics)</title>
  <link rel="stylesheet" href="../../../shared/story-system.css">
  <!-- Zero-CDN doctrine: GSAP vendored locally (shared/vendor/), identical
       bytes to gsap@3.14.2 dist. The engine seeks this timeline; it does
       not inject the library for us. -->
  <script src="../../../shared/vendor/gsap.min.js"></script>
  <style>
    /* P7.0 20S LIVING STORY — five scenes under one paused GSAP timeline.
       Dormant scenes/end-card are autoAlpha-hidden (visibility + opacity, so
       the contrast sampler can never measure invisible ink copy over a dark
       ground), and scene copy stacks hold the authored pre-bloom state.
       GSAP fromTo owns every animated property from its first seek. */
    .scene--s2, .scene--s3, .scene--s4, #end-card {
      opacity: 0;
      visibility: hidden;
    }
    .scene .t-eyebrow, .scene .t-display, .scene .cta,
    #end-card .t-display { opacity: 0; }
    .scene .t-display, #end-card .t-display { filter: blur(6px); }

    /* P7.0 LATERAL PUSH-WIPE ENTRANCE (Scene 4, 12.5s). The detail enters as
       a masked directional wipe instead of a fifth dissolve: the figure sits
       fully clipped at first paint (right inset 100 percent) and the GSAP
       fromTo collapses that inset to inset(0) so the reveal boundary sweeps
       left -> right while the inner visual counter-glides. Only the clip
       boundary moves — scrims and copy are stationary siblings. */
    .scene--s4 {
      clip-path: inset(0% 100% 0% 0%);
    }

    /* P7.0 SPLIT-PANE COMPOUND SCENE (Scene 3, 8.5-12.5s). Vertical 54/46
       duo-stack replicated from the engine's certified batch geometry
       (story-system.css ENGINE GEOMETRY CONTRACT vars: --duo-top-h 1037 /
       --duo-bottom-h 881 / --duo-gutter 2): TOP pane = room context
       (wide lifestyle), BOTTOM pane = macro hardware/detail hosting the
       copy platform over the pane-anchored deep bottom ramp. The reel root
       stays data-layout-family="mono-full" (Scene 1 is the modelled hero;
       the closed family set cannot express a moving reel), so the compound
       scene is self-contained local geometry that consumes the SAME contract
       variables — zero mirrored constants. The bone gutter stays a pure
       2px hairline separator. */
    .split-reel-scene {
      position: absolute;
      inset: 0;
    }
    .split-reel-scene .pane {
      position: absolute;
      left: 0;
      width: 1080px;
      overflow: hidden;
      background: var(--bone, #F6F1E7);
    }
    .split-reel-scene .pane--top {
      top: 0;
      height: var(--duo-top-h);
    }
    /* Slide-from-bottom wipe start state: the detail pane is fully
       clipped at first paint and the GSAP fromTo sweeps the boundary to
       the settled inset(0) — a directional push-wipe reveal, not a
       dissolve. */
    .split-reel-scene .pane--bottom {
      top: calc(var(--duo-top-h) + var(--duo-gutter));
      height: var(--duo-bottom-h);
      clip-path: inset(100% 0% 0% 0%);
    }
    .split-reel-scene .pane img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* SIGNATURE WHITE END-CARD (t=16.5s, z-index 100). The copy section
       reuses the engine's .copy / .copy--ink descendant recolor contract
       (ink = --espresso-900 on #ffffff, WCAG AA ~14:1, halos stripped by
       the engine rule); the local override re-pins the bottom-220px copy
       block to the end-card's centered composition. No plates, no shields
       — bare ink on white. */
    #end-card {
      position: absolute;
      inset: 0;
      background: #ffffff;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 44px;
    }
    .end-card__emblem {
      width: 176px;
      height: 176px;
      border-radius: 50%;
      object-fit: contain;
    }
    #end-card .copy {
      position: static !important;
      bottom: auto !important;
      left: auto !important;
      right: auto !important;
      align-items: center !important;
      text-align: center !important;
    }
    #end-card .t-display {
      font-size: 44px;
      letter-spacing: -0.01em;
    }
  </style>
</head>
<body>
  <main id="root" data-composition-id="dk-story-03" data-duration="20.0" data-fps="30" data-width="1080" data-height="1920" data-layout-family="mono-full"
        data-fx-chain="{&quot;version&quot;:1,&quot;nodes&quot;:[{&quot;type&quot;:&quot;truepeak&quot;,&quot;id&quot;:&quot;tp-master&quot;,&quot;label&quot;:&quot;Delivery ceiling&quot;,&quot;params&quot;:{&quot;ceiling&quot;:-3.6,&quot;lookahead&quot;:3,&quot;release&quot;:80}}]}">
    <!-- P7.0 CINEMATIC KINETICS REEL — five scenes + end-card.
         MOTION LAW (STATIONARY SCRIM LAW, §F.2/§H.9): scale + 2D pan/drift
         live ONLY on inner visual elements; scrims/copy/brand are STATIONARY
         siblings; wipe masks move the clip boundary only. Camera P7.0:
         beat-synced punch-zooms (1.00 -> 1.13, expo.out, clap-locked at
         4.5 / 8.5 / 12.5) + lateral sliders; pan frames hold scale >= 1.15
         so no frame edge is exposed. -->
    <article class="frame" aria-label="Direct Kitchens 20-second showroom reel: a wide architectural kitchen room, a material macro, a split-pane pairing of room context over hardware detail, a functional detail via lateral push-wipe, and a white end-card inviting a free design consultation">

      <!-- SCENE 1 (0.0–4.5s): WIDE ARCHITECTURAL HERO + MOTORIZED SLIDER.
           DSC02281 room. Motorized lateral pan x -110 -> +42 (right ->
           left across the cabinetry line) under a clap-synced arrival punch
           1.00 -> 1.12 expo.out at 0.50s; scale settles 1.12 -> 1.16
           (>= 1.15 bound). Scale + x live only on the inner visual. -->
      <figure class="photo photo--full scrim--charcoal scene scene--s1" aria-label="Wide architectural hero: a Direct Kitchens room showing cabinetry fronts, benchtop run and floor material">
        <img id="s1-img" data-layout-allow-overflow src="../../../assets/raw/optimized/DSC02281.jpg" alt="Wide architectural view of a Direct Kitchens room: cabinetry fronts, benchtop run and floor material">
        <span class="scrim scrim--top scrim--top--deep" aria-hidden="true"></span>
        <span class="scrim scrim--bottom scrim--bottom--deep" aria-hidden="true"></span>
        <section class="copy copy--bottom-left">
          <p class="t-eyebrow">Considered Kitchens</p>
          <h1 class="t-display">Fronts, stone,<br><span class="serif-accent">quiet hardware</span></h1>
        </section>
      </figure>

      <!-- SCENE 2 (4.5–8.5s): MATERIAL MACRO. DSC01748 portrait macro;
           whoosh cue on the clap-locked cut under the -9 dB notch. Camera:
           punch-zoom 1.00 -> 1.13 expo.out on the 4.5s downbeat, then a
           settling relay 1.13 -> 1.07 / y -6 -> +16. -->
      <figure class="photo photo--full scrim--charcoal scene scene--s2" aria-label="Material macro: portrait close-up of Direct Kitchens cabinetry finish and joinery hardware">
        <img id="s2-img" data-layout-allow-overflow src="../../../assets/raw/optimized/DSC01748.jpg" alt="Portrait macro close-up of Direct Kitchens cabinetry finish and joinery hardware">
        <span class="scrim scrim--top" aria-hidden="true"></span>
        <span class="scrim scrim--bottom scrim--bottom--deep" aria-hidden="true"></span>
        <section class="copy copy--bottom-left">
          <p class="t-eyebrow">Material Honesty</p>
          <h1 class="t-display">Timber, stone,<br><span class="serif-accent">honest</span> light</h1>
        </section>
      </figure>

      <!-- SCENE 3 (8.5–12.5s): SPLIT-PANE COMPOUND (54/46 duo-stack).
           TOP = DSC02989 room context: punch 1.00 -> 1.12 at 8.55, drift
           to 1.06 / y -18. BOTTOM = DSC02662 macro: counter-settle
           1.14 / x -26 / y +18 -> 1.07 / x +10 / y 0. Whoosh cue #2
           (-5.0 dB staging) lands under the -9 dB bed notch. -->
      <figure class="split-reel-scene scene scene--s3" aria-label="Split pane: Direct Kitchens room context above a close-up of hardware at the door-front junction">
        <div class="pane pane--top">
          <img id="s3-top-img" data-layout-allow-overflow src="../../../assets/raw/optimized/DSC02989.jpg" alt="Wide lived-in view of a Direct Kitchens room">
          <span class="scrim scrim--top" aria-hidden="true"></span>
        </div>
        <div class="pane pane--bottom">
          <img id="s3-bottom-img" data-layout-allow-overflow src="../../../assets/raw/optimized/DSC02662.jpg" alt="Close-up of hardware at a door-front junction: knobs, stile and benchtop edge">
          <span class="scrim scrim--top" aria-hidden="true"></span>
          <span class="scrim scrim--bottom scrim--bottom--deep" aria-hidden="true"></span>
          <section class="copy copy--bottom-left">
            <p class="t-eyebrow">Hardware Study</p>
            <h1 class="t-display">Every junction,<br><span class="serif-accent">quietly</span> exact</h1>
          </section>
        </div>
      </figure>

      <!-- SCENE 4 (12.5–16.5s): FUNCTIONAL DETAIL + LATERAL PUSH-WIPE.
           DSC02320 functional detail. Entrance: clip right inset 100 ->
           0 percent (0.75s power3.out at 12.5) while the page-turn cue
           lands under the -9 dB notch. Camera: punch 1.00 -> 1.13 expo.out
           on the 12.5s clap, counter-glide x +90 -> -22 (scale >= 1.15).
           Copy bloom 13.0 / 13.2. -->
      <figure class="photo photo--full scrim--charcoal scene scene--s4" aria-label="Functional detail: Direct Kitchens joinery detail showing hardware and benchtop edge">
        <img id="s4-img" data-layout-allow-overflow src="../../../assets/raw/optimized/DSC02320.jpg" alt="Functional joinery detail: hardware at a door-front junction with benchtop edge">
        <span class="scrim scrim--top" aria-hidden="true"></span>
        <span class="scrim scrim--bottom scrim--bottom--deep" aria-hidden="true"></span>
        <section class="copy copy--bottom-left">
          <p class="t-eyebrow">Joinery Detail</p>
          <h1 class="t-display">Every edge,<br><span class="serif-accent">considered</span></h1>
        </section>
      </figure>

      <!-- Persistent canvas-level brand knockout (one header for the whole
           reel — INK pole with the bare airy top pool; bright upper walls
           across the wide scenes and pane). -->
      <header class="bar-top bar-top--white" data-layout-allow-occlusion>
        <img src="../../../assets/logos/logo.svg" alt="Direct Kitchens" class="dk-brand-logo">
        <p class="brand">Direct Kitchens</p>
      </header>

      <!-- SCENE 5 (16.5–20.0s): SIGNATURE WHITE END-CARD — full 3.5s hold.
           Full-bleed white, z-index 100, activated at t=16.5 in sync with
           the tactile click; the badge reveal carries the click frame-
           exactly (16.50s). Circular dk knockout emblem + Variant A copy
           in ink on white (WCAG AA ~14:1). -->
      <div id="end-card" data-layout-allow-occlusion aria-label="Signature white end-card: Direct Kitchens circular dk emblem above the invitation to book a free design consultation">
        <img class="end-card__emblem" src="../../../assets/logos/logo.png" alt="Direct Kitchens circular dk emblem">
        <section class="copy copy--ink end-card__copy">
          <h1 class="t-display">Book your free<br>design consultation</h1>
        </section>
      </div>
    </article>

    <!-- P7.0 AUDIO DOCTRINE — 100% MUSIC-DRIVEN, ZERO VOICEOVER.
         BED: dk-bed-acoustic-claps-01, full 20s window; clip-local
         automation == composition time; 0.5s fade-in (curve on LEFT point).
         P7.0 notches: -9 dB dip (linear 0.3548) under every transition
         timestamp with a FAST 0.10s attack (full body 4.40 / 8.40 / 12.40
         -> 4.50 / 8.50 / 12.50), held ~0.4-0.45s, released by 5.2 / 9.25 /
         13.2, so the whooshes and the page-turn pierce the bed. 16.5s
         end-card pocket (-6 dB hold to 17.5), then the exponential
         -6 -> -60 dB tail (17.5-20.0). TruePeak ceiling -3.6 dBTP on the
         root data-fx-chain; body gain +0.5 dB (1.0593). All lane values
         scaled proportionally to preserve the notch and pocket ratios,
         verified by delivery-render measurement. -->
    <audio id="bed-claps" data-audio-group="music"
           src="../../../assets/audio/beds/dk-bed-acoustic-claps-01.mp3"
           data-start="0" data-duration="20"
           data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0,&quot;curve&quot;:0.5},{&quot;t&quot;:0.5,&quot;v&quot;:1.0593},{&quot;t&quot;:4.4,&quot;v&quot;:1.0593},{&quot;t&quot;:4.5,&quot;v&quot;:0.3548},{&quot;t&quot;:4.9,&quot;v&quot;:0.3548},{&quot;t&quot;:5.2,&quot;v&quot;:1.0593},{&quot;t&quot;:8.4,&quot;v&quot;:1.0593},{&quot;t&quot;:8.5,&quot;v&quot;:0.3548},{&quot;t&quot;:8.95,&quot;v&quot;:0.3548},{&quot;t&quot;:9.25,&quot;v&quot;:1.0593},{&quot;t&quot;:12.4,&quot;v&quot;:1.0593},{&quot;t&quot;:12.5,&quot;v&quot;:0.3548},{&quot;t&quot;:12.9,&quot;v&quot;:0.3548},{&quot;t&quot;:13.2,&quot;v&quot;:1.0593},{&quot;t&quot;:16.35,&quot;v&quot;:1.0593},{&quot;t&quot;:16.5,&quot;v&quot;:0.5012},{&quot;t&quot;:17.5,&quot;v&quot;:0.5012},{&quot;t&quot;:18.125,&quot;v&quot;:0.1059},{&quot;t&quot;:18.75,&quot;v&quot;:0.0224},{&quot;t&quot;:19.375,&quot;v&quot;:0.0047},{&quot;t&quot;:20,&quot;v&quot;:0.001}]}]}"></audio>

    <!-- CUE 1 (whoosh): scene-cut accent on the 4.5s clap cut, -5.0 dB
         staging under the -9 dB bed notch. -->
    <audio id="cue-whoosh-1" data-audio-group="sfx"
           src="../../../assets/audio/cues/whoosh-soft-01.mp3"
           data-start="4.5" data-hf-media-start-basis="local" data-volume="0.5623"></audio>

    <!-- CUE 2 (whoosh, compound push): -5.0 dB staging — the bed is carved
         to a -9 dB ducking notch 8.40-9.25. -->
    <audio id="cue-whoosh-2" data-audio-group="sfx"
           src="../../../assets/audio/cues/whoosh-soft-01.mp3"
           data-start="8.5" data-hf-media-start-basis="local" data-volume="0.5623"></audio>

    <!-- CUE 3 (page turn): the P7.0 lateral push-wipe at 12.5s — secondary
         cue, identical ducking precision (-5.0 dB staging, -9 dB notch
         12.40-13.20). -->
    <audio id="cue-page-turn-1" data-audio-group="sfx"
           src="../../../assets/audio/cues/accent-page-turn-01.mp3"
           data-start="12.5" data-hf-media-start-basis="local" data-volume="0.5623"></audio>

    <!-- CUE 4 (tactile click): signature end-card activation — lands
         frame-exactly on the circular dk badge reveal at t=16.50,
         relative level -6.5 dB (linear 0.4732) with a -6 dB bed pocket
         carved from 16.35 and held to the CTA settle. -->
    <audio id="cue-click" data-audio-group="sfx"
           src="../../../assets/audio/cues/click-tactile-01.mp3"
           data-start="16.5" data-hf-media-start-basis="local" data-volume="0.4732"></audio>

    <!-- CUE 5 (soft accent pop): CTA action settle at t=17.2, relative
         level -7.5 dB (linear 0.4217) — the invitation text landing
         while the bed holds its -6 dB duck floor. -->
    <audio id="cue-accent-pop" data-audio-group="sfx"
           src="../../../assets/audio/cues/accent-pop-01.mp3"
           data-start="17.2" data-hf-media-start-basis="local" data-volume="0.4217"></audio>

    <script>
      // P7.0 DYNAMIC LIVING STORY timeline — one paused GSAP timeline,
      // seek-driven, every property owned by fromTo from its first seek.
      // Beats:
      //   S1 0.0-4.5   motorized lateral pan x -110 -> +42 (right -> left
      //                across the cabinetry line) + arrival punch
      //                1.00 -> 1.12 expo.out at 0.50 (bed full-arrival
      //                clap); scale settles 1.12 -> 1.16; eyebrow 0.6-1.2;
      //                headline bloom 0.9-1.8.
      //   Cross 4.5    0.45s dissolve + whoosh cue 1 (-5.0 dB, -9 dB notch).
      //   S2 4.5-8.5   punch-zoom 1.00 -> 1.13 expo.out at the 4.5s clap
      //                (y -6); relay 1.13 -> 1.07 / y -> +16; copy 4.85-5.9.
      //   Cross 8.5    split reveal (NOT a dissolve): autoAlpha 0.45s +
      //                bottom pane push-wipe 100%->0% (0.8s power3.out at
      //                8.55) + whoosh cue 2 (-5.0 dB, -9 dB notch) +
      //                punches: top 1.00 -> 1.12, bottom counter-settle
      //                1.14 -> 1.07.
      //   S3 8.5-12.5  top relay 1.06 / y -18; bottom settle 1.07 / x +10 /
      //                y 0; copy bloom 9.05-9.9.
      //   Cross 12.5   LATERAL PUSH-WIPE into S4 (clip right inset 100% ->
      //                0%, 0.75s power3.out) + page-turn cue 3 (-5.0 dB,
      //                -9 dB notch) + punch 1.00 -> 1.13, glide x +90 -> -22.
      //   S4 12.5-16.5 relay 1.13 -> 1.18 / x -22; copy bloom 13.0-14.05.
      //   End 16.5     0.45s dissolve to white end-card (z100); badge
      //                16.50-17.20 frame-synced with the click cue; copy
      //                rise 16.95-17.75; bed notches
      //                (4.4-5.2 / 8.4-9.25 / 12.4-13.2 @ -9 dB,
      //                16.5-17.5 @ -6 dB) then exp decay -6 -> -60 dB
      //                17.5-20.0.
      (function () {
        document.fonts.ready.then(function () {
          var tl = gsap.timeline({ paused: true });

          // ── SCENE 1 ── (P7.0 motorized lateral slider + arrival punch)
          tl.fromTo("#s1-img", { x: -110 },
              { x: 42, duration: 4.5, ease: "power2.inOut" }, 0)
            .fromTo("#s1-img", { scale: 1 },
              { scale: 1.12, duration: 0.8, ease: "expo.out", immediateRender: false }, 0.5)
            .fromTo("#s1-img", { scale: 1.12 },
              { scale: 1.16, duration: 3.2, ease: "power1.inOut", immediateRender: false }, 1.3)
            .fromTo(".scene--s1 .t-eyebrow", { y: 10, opacity: 0 },
              { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" }, 0.6)
            .fromTo(".scene--s1 .t-display",
              { filter: "blur(6px)", opacity: 0 },
              { filter: "blur(0px)", opacity: 1, duration: 0.9, ease: "power2.out" }, 0.9);

          // ── CROSS 1 → SCENE 2 (4.5s, 0.45s dissolve) ──
          tl.fromTo(".scene--s1", { autoAlpha: 1 },
              { autoAlpha: 0, duration: 0.45, ease: "power1.inOut" }, 4.5)
            .fromTo(".scene--s2", { autoAlpha: 0 },
              { autoAlpha: 1, duration: 0.45, ease: "power1.inOut" }, 4.5)
            .fromTo("#s2-img", { scale: 1, y: 0 },
              { scale: 1.13, y: -6, duration: 0.85, ease: "expo.out" }, 4.5)
            .fromTo("#s2-img", { scale: 1.13, y: -6 },
              { scale: 1.07, y: 16, duration: 3.15, ease: "power1.inOut", immediateRender: false }, 5.35)
            .fromTo(".scene--s2 .t-eyebrow", { y: 10, opacity: 0 },
              { y: 0, opacity: 1, duration: 0.55, ease: "power2.out" }, 4.85)
            .fromTo(".scene--s2 .t-display",
              { filter: "blur(6px)", opacity: 0 },
              { filter: "blur(0px)", opacity: 1, duration: 0.85, ease: "power2.out" }, 5.05);

          // ── SPLIT REVEAL → SCENE 3 (8.5s, directional push-wipe) ──
          tl.fromTo(".scene--s2", { autoAlpha: 1 },
              { autoAlpha: 0, duration: 0.45, ease: "power1.inOut", immediateRender: false }, 8.5)
            .fromTo(".scene--s3", { autoAlpha: 0 },
              { autoAlpha: 1, duration: 0.45, ease: "power1.inOut" }, 8.5)
            .fromTo(".scene--s3 .pane--bottom",
              { clipPath: "inset(100% 0% 0% 0%)" },
              { clipPath: "inset(0% 0% 0% 0%)", duration: 0.8, ease: "power3.out" }, 8.55)
            .fromTo("#s3-top-img", { scale: 1, y: 0 },
              { scale: 1.12, y: -10, duration: 0.85, ease: "expo.out" }, 8.55)
            .fromTo("#s3-top-img", { scale: 1.12, y: -10 },
              { scale: 1.06, y: -18, duration: 3.1, ease: "power1.inOut", immediateRender: false }, 9.4)
            .fromTo("#s3-bottom-img", { scale: 1.14, x: -26, y: 18 },
              { scale: 1.07, x: 10, y: 0, duration: 3.95, ease: "power2.inOut" }, 8.55)
            .fromTo(".scene--s3 .t-eyebrow", { y: 10, opacity: 0 },
              { y: 0, opacity: 1, duration: 0.55, ease: "power2.out" }, 9.05)
            .fromTo(".scene--s3 .t-display",
              { filter: "blur(6px)", opacity: 0 },
              { filter: "blur(0px)", opacity: 1, duration: 0.85, ease: "power2.out" }, 9.25);

          // ── CROSS 2 → SCENE 4 (12.5s, 0.45s dissolve) ──
          tl.fromTo(".scene--s3", { autoAlpha: 1 },
              { autoAlpha: 0, duration: 0.45, ease: "power1.inOut", immediateRender: false }, 12.5)
            .fromTo(".scene--s4", { autoAlpha: 0 },
              { autoAlpha: 1, duration: 0.45, ease: "power1.inOut" }, 12.5)
            .fromTo(".scene--s4",
              { clipPath: "inset(0% 100% 0% 0%)" },
              { clipPath: "inset(0% 0% 0% 0%)", duration: 0.75, ease: "power3.out" }, 12.5)
            .fromTo("#s4-img", { scale: 1, x: 90 },
              { scale: 1.13, x: 34, duration: 0.85, ease: "expo.out" }, 12.5)
            .fromTo("#s4-img", { scale: 1.13, x: 34 },
              { scale: 1.18, x: -22, duration: 3.15, ease: "power1.inOut", immediateRender: false }, 13.35)
            .fromTo(".scene--s4 .t-eyebrow", { y: 10, opacity: 0 },
              { y: 0, opacity: 1, duration: 0.55, ease: "power2.out" }, 13.0)
            .fromTo(".scene--s4 .t-display",
              { filter: "blur(6px)", opacity: 0 },
              { filter: "blur(0px)", opacity: 1, duration: 0.85, ease: "power2.out" }, 13.2);

          // ── SIGNATURE WHITE END-CARD (16.5s, 0.45s dissolve + click) ──
          tl.fromTo(".scene--s4", { autoAlpha: 1 },
              { autoAlpha: 0, duration: 0.45, ease: "power1.inOut", immediateRender: false }, 16.5)
            .fromTo("#end-card", { autoAlpha: 0 },
              { autoAlpha: 1, duration: 0.45, ease: "power1.inOut" }, 16.5)
            .fromTo(".end-card__emblem", { scale: 0.92, opacity: 0 },
              { scale: 1, opacity: 1, duration: 0.7, ease: "power2.out" }, 16.5)
            .fromTo("#end-card .t-display",
              { y: 12, filter: "blur(6px)", opacity: 0 },
              { y: 0, filter: "blur(0px)", opacity: 1, duration: 0.8, ease: "power2.out" }, 16.95);

          window.__timelines["dk-story-03"] = tl;
        });
      })();
    </script>
  </main>
</body>
