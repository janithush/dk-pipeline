<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Direct Kitchens — story-03 — 20s Living Story Reel</title>
  <link rel="stylesheet" href="../../../shared/story-system.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
  <main id="root" data-composition-id="dk-story-03" data-duration="20.0" data-width="1080" data-height="1920">
    <article class="frame reel" aria-label="20 second living story reel — kitchen hero, macro detail, split pane, push-wipe, white end-card">
      <!-- S1 0.0-4.5s Hero wide — motorized lateral pan -->
      <section id="scene-hero" class="scene clip" data-duration="4.5">
        <figure class="photo photo--full scrim--charcoal">
          <img id="img-hero" class="reel-img" src="../../../assets/raw/optimized/DSC01651.jpg" alt="White flat-panel kitchen joinery with marble benchtop and warm under-cabinet lighting">
          <span class="scrim scrim--top" aria-hidden="true"></span>
          <span class="scrim scrim--bottom" aria-hidden="true"></span>
        </figure>
        <header class="bar-top bar-top--white">
          <img id="logo-hero" src="../../../assets/logos/logo.svg" alt="Direct Kitchens" class="dk-brand-logo">
          <p class="brand">Direct Kitchens</p>
        </header>
        <section class="copy copy--bottom-left">
          <p class="t-eyebrow">KITCHEN</p>
          <h1 class="t-display">Marble <span class="serif-accent">joinery</span></h1>
        </section>
      </section>

      <!-- S2 4.5-8.5s Macro focus — beat-synced arrival punch-zoom -->
      <section id="scene-macro" class="scene clip" data-duration="4.0">
        <figure class="photo photo--full scrim--warm">
          <img id="img-macro" class="reel-img" src="../../../assets/raw/optimized/DSC02379.jpg" alt="Open white cabinet drawer revealing pot storage beside stainless Wolf oven">
          <span class="scrim scrim--top" aria-hidden="true"></span>
          <span class="scrim scrim--bottom" aria-hidden="true"></span>
        </figure>
        <header class="bar-top bar-top--white">
          <img id="logo-macro" src="../../../assets/logos/logo.svg" alt="Direct Kitchens" class="dk-brand-logo">
          <p class="brand">Direct Kitchens</p>
        </header>
        <section class="copy copy--bottom-right">
          <p class="t-eyebrow">DETAIL</p>
          <h1 class="t-display">Hardware <span class="serif-accent">pulse</span></h1>
        </section>
      </section>

      <!-- S3 8.5-12.5s 54/46 duo-stack split -->
      <section id="scene-duo" class="scene clip" data-duration="4.0">
        <div class="duo-stack">
          <figure class="photo photo--pane pane-top scrim--charcoal">
            <img id="img-duo-top" class="reel-img" src="../../../assets/raw/optimized/DSC02989.jpg" alt="Full-width kitchen with white joinery and open timber pantry">
            <span class="scrim scrim--top" aria-hidden="true"></span>
            <span class="scrim scrim--bottom" aria-hidden="true"></span>
          </figure>
          <figure class="photo photo--pane pane-bottom scrim--warm">
            <img id="img-duo-bottom" class="reel-img" src="../../../assets/raw/optimized/DSC02131.jpg" alt="Polished marble benchtop with grey-gold veining">
            <span class="scrim scrim--top" aria-hidden="true"></span>
            <span class="scrim scrim--bottom--deep" aria-hidden="true"></span>
          </figure>
        </div>
        <header class="bar-top bar-top--white">
          <img id="logo-duo" src="../../../assets/logos/logo.svg" alt="Direct Kitchens" class="dk-brand-logo">
          <p class="brand">Direct Kitchens</p>
        </header>
      </section>

      <!-- S4 12.5-16.5s Functional detail — masked lateral push-wipe -->
      <section id="scene-wipe" class="scene clip" data-duration="4.0">
        <figure class="photo photo--full scrim--charcoal">
          <img id="img-wipe" class="reel-img" src="../../../assets/raw/optimized/DSC02636.jpg" alt="Gas cooktop with red control knobs above Wolf oven">
          <span class="scrim scrim--top" aria-hidden="true"></span>
          <span class="scrim scrim--bottom" aria-hidden="true"></span>
        </figure>
        <header class="bar-top bar-top--white">
          <img id="logo-wipe" src="../../../assets/logos/logo.svg" alt="Direct Kitchens" class="dk-brand-logo">
          <p class="brand">Direct Kitchens</p>
        </header>
        <section class="copy copy--bottom-right">
          <p class="t-eyebrow">APPLIANCE</p>
          <h1 class="t-display">Control <span class="serif-accent">point</span></h1>
        </section>
      </section>

      <!-- S5 16.5-20.0s Pure white end-card with centered dk emblem and CTA -->
      <section id="scene-endcard" class="scene clip end-card" data-duration="3.5">
        <div class="end-card-content">
          <div id="emblem-dk" class="dk-emblem">dk</div>
          <p class="cta">Visit our showroom</p>
        </div>
      </section>
    </article>
  </main>
</body>
</html>
