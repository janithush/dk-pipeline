<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>DK — Daily Composition Router</title>
  <link rel="stylesheet" href="shared/token.css">
  <link rel="stylesheet" href="shared/shared.css">
</head>
<body>
  <!-- Lightweight router / manifest.
       One data-composition-src entry per post in today's batch.
       All creative markup lives in compositions/YYYY-MM-DD/.
       This file never accumulates creative HTML. -->
  <div id="root" class="hyperframes-root"
    data-composition-id="router"
    data-duration="0.033"
    data-no-timeline
    data-width="1080"
    data-height="1920">
    <!-- Today's compositions (rewritten each production day) -->
    <div id="post-01" data-composition-id="dk-story-01" data-composition-src="compositions/2026-10-22/batch-01/story-01.html"></div>
    <div id="post-02" data-composition-id="dk-story-02" data-composition-src="compositions/2026-10-22/batch-01/story-02.html"></div>
    <div id="post-03" data-composition-id="dk-story-03" data-composition-src="compositions/2026-10-22/batch-01/story-03.html"></div>
    <div id="post-04" data-composition-id="dk-story-04" data-composition-src="compositions/2026-10-22/batch-01/story-04.html"></div>
    <div id="post-05" data-composition-id="dk-story-05" data-composition-src="compositions/2026-10-22/batch-02/story-05.html"></div>
    <div id="post-06" data-composition-id="dk-story-06" data-composition-src="compositions/2026-10-22/batch-02/story-06.html"></div>
    <div id="post-07" data-composition-id="dk-story-07" data-composition-src="compositions/2026-10-22/batch-02/story-07.html"></div>
    <div id="post-08" data-composition-id="dk-story-08" data-composition-src="compositions/2026-10-22/batch-02/story-08.html"></div>
  </div>
</body>
</html>
